
name: MODO - Integracion Continua

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Configurar pnpm
        run: npm install -g pnpm@11.17.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad con ESLint
        run: pnpm run lint:eslint

      - name: Compilar React
        env:
          VITE_MODO_AI_API_URL: ${{ vars.VITE_MODO_AI_API_URL }}
        run: pnpm run build

      - name: Almacenar artefacto de compilacion
        uses: actions/upload-artifact@v4
        with:
          name: modo-dist
          path: dist/
          if-no-files-found: error


  deploy:
    name: Deploy AWS S3
    runs-on: ubuntu-latest

    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: modo-dist
          path: dist

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Desplegar en Amazon S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }}
